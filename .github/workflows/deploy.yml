name: Deploy app from zip
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unzip the app
        run: |
          mkdir site tmp
          z=$(ls *.zip | head -n 1)
          unzip -q -o "$z" -d tmp
          d=$(find tmp -name index.html -printf '%h\n' | head -n 1)
          cp -r "$d"/. site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
